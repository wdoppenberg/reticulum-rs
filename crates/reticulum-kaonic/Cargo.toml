[package]
name = "reticulum-kaonic"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs"
categories = ["network-programming"]
keywords = ["reticulum", "kaonic", "radio", "grpc", "lora"]

description = """
Kaonic radio hardware integration for the Reticulum Network Stack.
Provides gRPC-based interface to Kaonic LoRa/sub-GHz radio modules.
"""

[dependencies]
# Core and runtime
reticulum-core = { path = "../reticulum-core", version = "0.1.0" }
reticulum-tokio = { path = "../reticulum-tokio", version = "0.1.0" }

# gRPC
tonic = "0.13.0"
prost = "0.13.5"

# Async runtime
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# Logging
log = "0.4.27"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
tonic-build = "0.13.0"
