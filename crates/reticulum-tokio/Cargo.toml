[package]
name = "reticulum-tokio"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/BeechatNetworkSystemsLtd/Reticulum-rs"
categories = ["network-programming", "asynchronous"]
keywords = ["reticulum", "mesh", "async", "tokio", "networking"]

description = """
Tokio-based async runtime implementation for the Reticulum Network Stack.
Provides transport layer, interface management, and routing for network nodes.
"""

[dependencies]
# Core protocol implementation
reticulum-core = { path = "../reticulum-core", version = "0.1.0" }

# Async runtime
tokio = { version = "1.52.1", features = ["full"] }
tokio-stream = "0.1.18"
tokio-util = "0.7.18"

# Serialization
rmp = "0.8.15"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1"

# Crypto (for runtime-specific needs)
rand_core = { version = "0.10.1", default-features = false }

# Logging
log = "0.4.29"
env_logger = "0.11"
ed25519-dalek = { version = "3.0.0-pre.6", default-features = false, features = ["zeroize"] }
sha2 = "0.11.0"
x25519-dalek = { version = "3.0.0-pre.6", default-features = false, features = ["static_secrets", "zeroize"] }
tokio-serial = "5.4.5"
rand = { version = "0.10.1", features = ["sys_rng"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

[dev-dependencies]
tokio = { version = "1.52.1", features = ["test-util"] }
serde_json = "1"
hex = "0.4"

[[example]]
name = "reticulum_basic"
path = "../../examples/reticulum_basic.rs"

[[example]]
name = "peer"
path = "../../examples/peer.rs"

[[example]]
name = "compat_node"
path = "../../examples/compat_node.rs"
