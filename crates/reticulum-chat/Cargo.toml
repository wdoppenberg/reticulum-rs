[package]
name = "reticulum-chat"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wdoppenberg/reticulum-rs"
categories = ["network-programming", "asynchronous"]
keywords = ["reticulum", "mesh", "chat", "async", "networking"]

description = """
Building blocks for text-based chat over the Reticulum Network Stack.
Models the core concepts from MeshChat (destination discovery, link
management, channel messaging) as a reusable library.
"""

[dependencies]
reticulum-core = { path = "../reticulum-core", version = "0.1.0" }
reticulum-tokio = { path = "../reticulum-tokio", version = "0.1.0" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
rand_core = { version = "0.6", features = ["getrandom"] }
log = "0.4"

[dev-dependencies]
env_logger = "0.10"
tokio = { version = "1", features = ["test-util", "macros"] }
